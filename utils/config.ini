[Paths]
processing_dir = C:\Shinseikai\FileTransfer\processing
# 移動先は target_dir1, target_dir2... と番号付きで複数指定できる
target_dir1 = C:\Users\yokam\Desktop\Magnate\file
# 移動対象のファイル名（カンマ区切り、拡張子込み）。空欄の場合は全ファイルが対象
filename1 =

[Rename]
# target_dirN に追加するパターン（ファイル名末尾、拡張子の前）。空欄の場合は何も追加しない
pattern1 = _magnate

[App]
# ファイル書き込み完了を待つ時間（秒）
wait_time = 0.5

[LOGGING]
